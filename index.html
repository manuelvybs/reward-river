<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reward River</title>
<meta name="description" content="Run the canyon, swing the chasm and ride the river with the VYBS astronaut. A browser game in Three.js.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #ffffff; --shadow: rgba(120, 58, 30, .55); --gold: #ffd401; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4d7ae; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;
        opacity: 0; transition: opacity .9s ease; color: var(--ink); font-family: Kanit, system-ui, sans-serif; text-shadow: 0 3px 18px var(--shadow), 0 0 2px rgba(120, 58, 30, .4); text-align: center; padding: 0 16px; }
  .ov.on { opacity: 1; }
  #title, #end, #pause { background: radial-gradient(ellipse at 50% 46%, rgba(110, 50, 25, .32), rgba(110, 50, 25, 0) 62%); }
  h1 { font-weight: 700; font-size: clamp(40px, 7.4vw, 112px); letter-spacing: .01em; line-height: 1; margin: 0; }
  .sub { font-size: clamp(14px, 1.5vw, 21px); letter-spacing: .18em; text-transform: uppercase; margin-top: .7em; opacity: .95; }
  .press { margin-top: 2.4em; font-size: clamp(13px, 1.3vw, 18px); letter-spacing: .3em; text-transform: uppercase; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .ctl { position: absolute; bottom: 6vh; left: 16px; right: 16px; font-size: clamp(12px, 1.05vw, 15px); letter-spacing: .05em; opacity: .9; }
  #endStats { margin-top: .8em; font-size: clamp(16px, 1.8vw, 26px); letter-spacing: .08em; }
  #loading { color: #a45d3d; text-shadow: none; font-size: 15px; letter-spacing: .3em; text-transform: uppercase; }
  #hud { position: fixed; right: max(16px, 3vw); top: max(14px, 3vh); display: flex; align-items: center; gap: .45em; color: #fff; font: 600 22px Kanit, system-ui, sans-serif;
         text-shadow: 0 1px 8px var(--shadow); opacity: 0; transition: opacity .5s; pointer-events: none; }
  #hud.on { opacity: 1; }
  #hud i { width: 24px; height: 24px; background: var(--gold); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); filter: drop-shadow(0 0 6px rgba(255, 190, 0, .8)); }
  #hud small { opacity: .75; font-weight: 400; }
  #fade { position: fixed; inset: 0; background: #fff1dc; opacity: 0; transition: opacity .35s; pointer-events: none; }
  #fade.on { opacity: 1; transition: opacity .12s; }
  #rotate { display: none; position: absolute; top: 8vh; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<div id="loading" class="ov on">waking the astronaut…</div>
<div id="title" class="ov"><h1 id="gameTitle"></h1><div class="sub" id="gameSub"></div><div class="press">press enter · tap</div><div class="ctl" id="gameControls"></div><div id="rotate">turn your phone sideways</div></div>
<div id="end" class="ov"><h1>Reward River</h1><div id="endStats"></div><div class="press">R · play again</div></div>
<div id="pause" class="ov"><h1 style="font-size:clamp(34px,4.5vw,64px)">paused</h1><div class="press">P · resume</div></div>
<div id="hud"><i></i><b id="medalCount">0</b><small>/ <span id="medalTotal">0</span></small></div>
<div id="fade"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
