<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop Viewer</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#f2b27e,#ffe7c2);font:600 14px system-ui}canvas{display:block}.l{position:fixed;bottom:12px;transform:translateX(-50%);color:#5a2f1a}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/jsm/" } }</script>
</head>
<body>
<script type="module">
// ?glb=<url>&yaws=0,90,180,270   one copy per yaw, seen from +Z (game forward is -Z, so "facing the camera" = facing +Z)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const yaws = (q.get('yaws') || '0,90,180,270').split(',').map(Number);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffe9cc, 0xb07c55, 1.7));
const sun = new THREE.DirectionalLight(0xffd29a, 2.4); sun.position.set(3, 4, 5); scene.add(sun);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync(q.get('glb'));
const box = new THREE.Box3().setFromObject(gltf.scene), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
const s = 1 / Math.max(size.x, size.y, size.z);
yaws.forEach((y, i) => {
  const holder = new THREE.Group(), m = gltf.scene.clone(true);
  m.position.set(-c.x, -box.min.y, -c.z); holder.add(m); holder.scale.setScalar(s);
  const outer = new THREE.Group(); outer.add(holder); outer.rotation.y = THREE.MathUtils.degToRad(y);
  outer.position.x = (i - (yaws.length - 1) / 2) * 1.3; scene.add(outer);
  const l = document.createElement('div'); l.className = 'l'; l.textContent = `yaw ${y}°`; l.style.left = `${(i + 0.5) / yaws.length * 100}%`; document.body.appendChild(l);
});
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.1, (yaws.length * 1.3) / 2 / Math.tan(THREE.MathUtils.degToRad(13)) / (innerWidth / innerHeight) + 0.8); camera.lookAt(0, 0.45, 0);
renderer.setAnimationLoop(() => renderer.render(scene, camera));
window.__viewer = { ready: true, size: size.toArray(), center: c.toArray() };
</script>
</body>
</html>
